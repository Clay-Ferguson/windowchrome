[project]
name = "windowchrome"
version = "0.1.0"
description = "Shared widget looks for PyQt6 apps on Linux: markdown viewer, wide scroll bars, radio, check box and toggle switch."
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windowchrome"]
