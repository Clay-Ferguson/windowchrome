[project]
name = "windowchrome"
version = "0.1.0"
description = "Colored title bar and window border for PyQt6 apps on Linux/Wayland."
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windowchrome"]
